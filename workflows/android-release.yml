name: Build Android Release (signed)
# يعمل عند دفع وسم مثل v36.0.0 أو يدويًا من تبويب Actions
on:
  push: { tags: ['v*'] }
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    env:
      JKH_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      JKH_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      JKH_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: التحقق من أسرار التوقيع
        env: { KS: '${{ secrets.KEYSTORE_BASE64 }}' }
        run: |
          if [ -z "$KS" ] || [ -z "$JKH_KEYSTORE_PASSWORD" ] || [ -z "$JKH_KEY_ALIAS" ] || [ -z "$JKH_KEY_PASSWORD" ]; then
            echo "::error::أسرار التوقيع غير مكتملة. أضف KEYSTORE_BASE64 و KEYSTORE_PASSWORD و KEY_ALIAS و KEY_PASSWORD في Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "JKH_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: رقم الإصدار
        run: |
          V="${GITHUB_REF_NAME#v}"; [ "${GITHUB_REF_TYPE}" = "tag" ] || V="0.0.${GITHUB_RUN_NUMBER}"
          echo "JKH_VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "JKH_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle assembleRelease bundleRelease --no-daemon
      - name: تسمية الملفات
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/JKH-Cases-${JKH_VERSION_NAME}.apk
          cp app/build/outputs/bundle/release/app-release.aab out/JKH-Cases-${JKH_VERSION_NAME}.aab
      - uses: actions/upload-artifact@v4
        with: { name: JKH-Android-signed, path: android/out/* }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with: { files: android/out/* }
